<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara's Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: one full-screen night sky. Nine reason-stars sit on a heart outline; a text panel rises from the bottom. */
  :root {
    --sky: #07060f;
    --ink: #f4e9f5;
    --dim: #9b8fb0;
    --rose: #ff9fd2;
    --gold: #ffd9a0;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--sky); color: var(--ink);
    font-family: var(--body); overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .top, .panel {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
  .top h1 {
    margin: 0; font: italic 600 clamp(26px, 6vw, 40px)/1.1 var(--display);
    color: var(--rose); text-wrap: balance;
  }
  .top p { margin: 8px 0 0; font-size: 13px; letter-spacing: 0.04em; color: var(--dim); }
  .panel { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); min-height: 120px; }
  .panel .reason {
    margin: 0 auto; max-width: 30ch; font: italic 500 clamp(22px, 5.2vw, 30px)/1.25 var(--display);
    color: var(--ink); text-wrap: balance; opacity: 0; transition: opacity .6s ease;
  }
  .panel .reason.on { opacity: 1; }
  .panel .count { margin-top: 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
  .panel.done .reason { color: var(--gold); font-size: clamp(30px, 8vw, 48px); }
  button#again {
    pointer-events: auto; margin-top: 14px; background: none; color: var(--dim);
    border: 1px solid rgba(155,143,176,.4); border-radius: 999px; padding: 8px 16px;
    font: 12px var(--body); letter-spacing: .08em; cursor: pointer;
  }
  button#again:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  button#again[hidden] { display: none; }
</style>
</head>
<body>

<canvas id="sky" aria-label="Night sky of stars"></canvas>
<div class="top">
  <h1>Sara's Sky</h1>
  <p id="hint">Tap the glowing stars to see why I love you</p>
</div>
<div class="panel" id="panel">
  <div class="reason" id="reason" role="status" aria-live="polite"></div>
  <div class="count" id="count">0 / 10 stars</div>
  <button id="again" hidden>Watch again</button>
</div>

<script>
(function () {
  var REASONS = [
    "Because when you laugh, everything feels lighter.",
    "Because with you I feel at ease without even trying.",
    "Because you understand me even without words.",
    "Because you are the place where I feel at home.",
    "Because you make me a better version of myself.",
    "Because even the heavy days turn beautiful when you're there.",
    "Because I love hearing your voice, even when I'm tired.",
    "Because you turn ordinary days into something I look forward to.",
    "Because every day I love you more than the day before.",
    "Because it's you, Sara."
  ];
  var N = REASONS.length;
  var FINAL = "I love you, Sara.";
  var c = document.getElementById("sky"), g = c.getContext("2d");
  var reasonEl = document.getElementById("reason"), countEl = document.getElementById("count");
  var panel = document.getElementById("panel"), hint = document.getElementById("hint");
  var again = document.getElementById("again");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, dpr, bg = [], hearts = [], shoots = [], lit = [], order = [], done = false, active = -1;
  var t0 = performance.now(), lastShoot = 0, doneAt = 0;

  function heartPt(a) {
    return {
      x: 16 * Math.pow(Math.sin(a), 3),
      y: 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)
    };
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // fit the whole heart between the title (top) and the text panel (bottom)
    var topPad = Math.min(92, H * 0.2), botPad = Math.min(200, H * 0.34);
    var availH = H - topPad - botPad;
    var s = Math.max(1, Math.min((W - 48) / 34, availH / 30));
    var cx = W / 2, cy = topPad + availH / 2 - 2.5 * s;
    // smooth closed outline, starting at the bottom tip
    var pts = [], k;
    for (k = 0; k <= 240; k++) {
      var q = heartPt(Math.PI + Math.PI * 2 * k / 240);
      pts.push({ x: cx + q.x * s, y: cy - q.y * s });
    }
    // 10 stars placed on the heart's key points, left-right symmetric:
    // bottom tip, 4 up the left side, centre dip, 4 down the right side
    var TP = Math.PI * 2;
    var angles = [Math.PI, TP - 2.45, TP - 2.0, TP - 1.45, TP - 0.8, 0, 0.8, 1.45, 2.0, 2.45];
    hearts = [];
    for (var i = 0; i < angles.length; i++) {
      var p = heartPt(angles[i]);
      hearts.push({ x: cx + p.x * s, y: cy - p.y * s, ph: i * 1.3 });
    }
    hearts.outline = pts;
  }

  function seedBg() {
    bg = [];
    for (var i = 0; i < 140; i++) {
      bg.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random() * 1.3, ph: Math.random() * 6.28, sp: 0.8 + Math.random() * 2 });
    }
  }

  function showReason(txt) {
    reasonEl.classList.remove("on");
    setTimeout(function () { reasonEl.textContent = txt; reasonEl.classList.add("on"); }, reduce ? 0 : 180);
  }

  function updateCount() {
    countEl.textContent = lit.length + " / " + N + " stars";
  }

  function tapAt(x, y) {
    var best = -1, bd = 34 * 34;
    for (var i = 0; i < hearts.length; i++) {
      var dx = hearts[i].x - x, dy = hearts[i].y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) { spawnShoot(); return; }
    active = best;
    if (lit.indexOf(best) < 0) { lit.push(best); order.push(best); }
    hint.style.opacity = "0";
    showReason(REASONS[best]);
    updateCount();
    if (lit.length === N && !done) {
      done = true; doneAt = (performance.now() - t0) / 1000;
      setTimeout(function () {
        panel.classList.add("done");
        showReason(FINAL);
        countEl.textContent = "it's all written in the sky";
        again.hidden = false;
      }, 2600);
    }
  }

  function spawnShoot() {
    shoots.push({
      x: Math.random() * W * 0.8 + W * 0.1, y: Math.random() * H * 0.35,
      vx: (Math.random() < 0.5 ? -1 : 1) * (260 + Math.random() * 200), vy: 150 + Math.random() * 120,
      life: 0, max: 0.9 + Math.random() * 0.4
    });
  }

  function drawStar(x, y, r, col, glow) {
    var gr = g.createRadialGradient(x, y, 0, x, y, r * glow);
    gr.addColorStop(0, col); gr.addColorStop(1, "rgba(255,159,210,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * glow, 0, 6.283); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, r * 0.45, 0, 6.283); g.fill();
  }

  var last = performance.now();
  function frame(now) {
    var t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#07060f"; g.fillRect(0, 0, W, H);

    // soft aurora behind the heart
    var gr = g.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.6);
    gr.addColorStop(0, "rgba(90,40,120,0.35)"); gr.addColorStop(1, "rgba(7,6,15,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    for (var i = 0; i < bg.length; i++) {
      var b = bg[i], a = reduce ? 0.55 : 0.3 + 0.35 * Math.sin(t * b.sp + b.ph);
      g.fillStyle = "rgba(215,210,255," + a.toFixed(2) + ")";
      g.beginPath(); g.arc(b.x * W, b.y * H, b.r, 0, 6.283); g.fill();
    }

    // heart fill when complete
    if (done) {
      var f = Math.min(1, (t - doneAt) / 2.5);
      g.beginPath();
      for (var k = 0; k < hearts.outline.length; k++) {
        var o = hearts.outline[k];
        if (k === 0) g.moveTo(o.x, o.y); else g.lineTo(o.x, o.y);
      }
      g.closePath();
      g.fillStyle = "rgba(255,159,210," + (0.14 * f).toFixed(3) + ")"; g.fill();
    }

    // constellation lines
    g.lineWidth = 1.2;
    // join neighbouring stars along the heart whenever both are lit
    g.strokeStyle = "rgba(255,159,210,0.55)";
    for (var j = 0; j < N; j++) {
      var nx = (j + 1) % N;
      if (lit.indexOf(j) < 0 || lit.indexOf(nx) < 0) continue;
      g.beginPath(); g.moveTo(hearts[j].x, hearts[j].y); g.lineTo(hearts[nx].x, hearts[nx].y); g.stroke();
    }
    if (done) {
      // finished: a smooth glowing heart outline fades in over the straight links
      var f2 = Math.min(1, (t - doneAt) / 2.5);
      g.beginPath();
      for (var m = 0; m < hearts.outline.length; m++) {
        var om = hearts.outline[m];
        if (m === 0) g.moveTo(om.x, om.y); else g.lineTo(om.x, om.y);
      }
      g.closePath();
      g.strokeStyle = "rgba(255,200,235," + (0.85 * f2).toFixed(3) + ")";
      g.lineWidth = 2; g.stroke();
      g.lineWidth = 1.2;
    }

    // reason stars
    g.globalCompositeOperation = "lighter";
    for (var n = 0; n < hearts.length; n++) {
      var h = hearts[n], on = lit.indexOf(n) >= 0;
      var pulse = reduce ? 1 : 1 + 0.18 * Math.sin(t * 2.2 + h.ph);
      if (on) {
        drawStar(h.x, h.y, (n === active ? 13 : 9) * pulse, "rgba(255,200,235,0.95)", 3.2);
      } else {
        drawStar(h.x, h.y, 7 * pulse, "rgba(255,217,160,0.8)", 3.6);
      }
    }

    // shooting stars
    if (!reduce && t - lastShoot > (done ? 1.6 : 5)) { lastShoot = t; spawnShoot(); }
    for (var s = shoots.length - 1; s >= 0; s--) {
      var sh = shoots[s]; sh.life += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      var al = 1 - sh.life / sh.max;
      if (al <= 0) { shoots.splice(s, 1); continue; }
      var tx = sh.x - sh.vx * 0.22, ty = sh.y - sh.vy * 0.22;
      var lg = g.createLinearGradient(sh.x, sh.y, tx, ty);
      lg.addColorStop(0, "rgba(255,255,255," + al.toFixed(2) + ")"); lg.addColorStop(1, "rgba(255,159,210,0)");
      g.strokeStyle = lg; g.lineWidth = 2;
      g.beginPath(); g.moveTo(sh.x, sh.y); g.lineTo(tx, ty); g.stroke();
    }
    requestAnimationFrame(frame);
  }

  function reset() {
    lit = []; order = []; done = false; active = -1;
    panel.classList.remove("done"); again.hidden = true;
    reasonEl.classList.remove("on"); updateCount(); hint.style.opacity = "1";
  }

  c.addEventListener("pointerdown", function (e) { tapAt(e.clientX, e.clientY); });
  again.addEventListener("click", reset);
  window.addEventListener("resize", layout);
  layout(); seedBg(); updateCount();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
