<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sara</title>
<style>
  :root { --bg: #000; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
  :root[data-theme="dark"] { --bg: #000; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var c = document.getElementById("c"), g = c.getContext("2d");
  var W, H, S, dpr;
  var N = 450, GATHER = 2.6, YO = 27;
  var stars = [], bg = [], t0 = performance.now();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H) / 700 * (W < H ? 1.2 : 1);
  }

  function build() {
    stars = []; bg = [];
    var R = Math.hypot(W, H) / S / 2 + 40;
    for (var i = 0; i < N; i++) {
      var a = 2 * Math.PI * i / N;
      var k = 11 * Math.sqrt(0.55 + Math.random() * 0.45);
      var X = 16 * Math.pow(Math.sin(a), 3);
      var Y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      var ang = Math.random() * 6.283, d = R + Math.random() * 100;
      stars.push({
        sx: d * Math.cos(ang), sy: d * Math.sin(ang),
        tx: X * k, ty: Y * k + YO * 1,
        size: 2 + Math.random() * 4, delay: Math.random() * 0.45,
        swirl: 1.5 + Math.random() * 1.5, ph: Math.random() * 6.283,
        col: "hsl(" + (317 + 43 * (i / N)) + ",85%,74%)"
      });
    }
    for (var j = 0; j < 110; j++) {
      bg.push({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 1.6, ph: Math.random() * 6.283 });
    }
  }

  function ease(x) { return 1 - Math.pow(1 - x, 3); }

  function sparkle(px, py, size, col) {
    g.fillStyle = col; g.strokeStyle = col;
    if (size < 3.5) {
      g.beginPath(); g.arc(px, py, size * 0.8 * S, 0, 6.283); g.fill();
    } else {
      var l = size * S;
      g.lineWidth = Math.max(1, 1.2 * S);
      g.beginPath();
      g.moveTo(px - l, py); g.lineTo(px + l, py);
      g.moveTo(px, py - l); g.lineTo(px, py + l);
      g.stroke();
    }
  }

  function frame(now) {
    var t = (now - t0) / 1000;
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

    for (var j = 0; j < bg.length; j++) {
      var b = bg[j], al = 0.35 + 0.3 * Math.sin(t * 2 + b.ph);
      g.fillStyle = "rgba(210,210,255," + al.toFixed(2) + ")";
      g.beginPath(); g.arc(b.x * W, b.y * H, b.s, 0, 6.283); g.fill();
    }

    var prog = Math.min(1, t / GATHER), beat = 1;
    if (t > GATHER) {
      var u = ((t - GATHER) * 1.3) % 1;
      beat = 1 + 0.07 * (Math.exp(-Math.pow((u - 0.1) / 0.05, 2)) + 0.7 * Math.exp(-Math.pow((u - 0.3) / 0.06, 2)));
    }

    g.globalCompositeOperation = "lighter";
    var cx = W / 2, cy = H / 2;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var e = ease(Math.max(0, Math.min(1, (prog - s.delay) / (1 - s.delay))));
      var x = s.sx + (s.tx * beat - s.sx) * e;
      var y = s.sy + (s.ty * beat - s.sy) * e;
      var sw = (1 - e) * s.swirl, cs = Math.cos(sw), sn = Math.sin(sw);
      var rx = x * cs - y * sn, ry = x * sn + y * cs;
      var tw = 0.75 + 0.25 * Math.sin(t * 5 + s.ph);
      sparkle(cx + rx * S, cy - ry * S, s.size * tw, s.col);
    }

    g.globalCompositeOperation = "source-over";
    var fade = Math.min(1, Math.max(0, (t - GATHER) / 2.5));
    if (fade > 0) {
      var a2 = fade * (0.85 + 0.15 * Math.sin(t * 3));
      g.fillStyle = "rgba(255,190,235," + a2.toFixed(3) + ")";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.font = "italic " + (28 * S) + "px Georgia, 'Times New Roman', serif";
      g.fillText("I love you,", cx, cy - 8 * S);
      g.font = "italic bold " + (48 * S) + "px Georgia, 'Times New Roman', serif";
      g.fillText("Sara", cx, cy + 50 * S);
    }
    requestAnimationFrame(frame);
  }

  resize(); build();
  window.addEventListener("resize", function () { resize(); build(); });
  c.addEventListener("click", function () { t0 = performance.now(); build(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
